<!-- 添加安全画像弹窗 -->
<div class="modal fade" id="addProfileModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
<form id="addProfileForm"><input type="hidden" name="customer_id" value="{{ customer.id }}">
<div class="modal-header"><h5 class="modal-title">添加安全画像</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
    <div class="mb-3"><label class="form-label">产品类别</label><select name="product_category" class="form-select"><option value="">请选择</option>{% for cat in all_categories %}<option>{{ cat }}</option>{% endfor %}</select></div>
    <div class="mb-3"><label class="form-label">现有方案/供应商</label><input type="text" name="current_solution" class="form-control"></div>
    <div class="row g-2"><div class="col-6"><label class="form-label">采购年份</label><input type="text" name="purchase_year" class="form-control" placeholder="如: 2024"></div>
    <div class="col-6"><label class="form-label">满意度</label><select name="satisfaction" class="form-select"><option value="">请选择</option><option>高</option><option>中</option><option>低</option></select></div></div>
</div>
<div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
</form></div></div></div>

<!-- 添加关键人弹窗 -->
<div class="modal fade" id="addPersonModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
<form id="addPersonForm"><input type="hidden" name="customer_id" value="{{ customer.id }}">
<div class="modal-header"><h5 class="modal-title">添加关键人</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
    <div class="row g-2">
        <div class="col-md-6"><label class="form-label">姓名 *</label><input type="text" name="name" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">职位</label><input type="text" name="title" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">部门</label><select name="department" class="form-select"><option value="">请选择</option><option>IT部</option><option>信息安全部</option><option>采购部</option><option>管理层</option></select></div>
        <div class="col-md-6"><label class="form-label">角色</label><select name="role" class="form-select"><option value="">请选择</option><option>决策者</option><option>影响者</option><option>技术评估</option><option>采购执行</option></select></div>
        <div class="col-md-6"><label class="form-label">电话</label><input type="text" name="phone" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">微信</label><input type="text" name="wechat" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">关系深度</label><select name="relationship_level" class="form-select"><option value="认识">认识</option><option value="熟悉">熟悉</option><option value="信任">信任</option><option value="陌生">陌生</option></select></div>
        <div class="col-md-6"><label class="form-label">个人风格</label><input type="text" name="personality_notes" class="form-control"></div>
    </div>
</div>
<div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button type="submit" class="btn btn-primary">保存</button></div>
</form></div></div></div>
