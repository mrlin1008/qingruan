<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}长亭湖南 · 作战指挥{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="bi bi-shield-shaded"></i></div>
            <div class="brand-text">
                <span class="brand-title">长亭科技</span>
                <span class="brand-sub">湖南作战指挥</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item {% if request.path=='/' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i><span>驾驶舱</span>
            </a>
            <a href="/signals" class="nav-item {% if request.path=='/signals' %}active{% endif %}">
                <i class="bi bi-eye"></i><span>市场洞察</span>
            </a>
            <a href="/customers" class="nav-item {% if request.path.startswith('/customer') %}active{% endif %}">
                <i class="bi bi-people"></i><span>重点客户</span>
            </a>
            <a href="/opportunities" class="nav-item {% if request.path=='/opportunities' %}active{% endif %}">
                <i class="bi bi-kanban"></i><span>商机管线</span>
            </a>
            <a href="/bidding" class="nav-item {% if request.path=='/bidding' %}active{% endif %}">
                <i class="bi bi-file-earmark-text"></i><span>招投标</span>
            </a>
            <a href="/competitors" class="nav-item {% if request.path=='/competitors' %}active{% endif %}">
                <i class="bi bi-shield-exclamation"></i><span>竞争情报</span>
            </a>
            <a href="/insights" class="nav-item {% if request.path=='/insights' %}active{% endif %}">
                <i class="bi bi-graph-up"></i><span>市场洞察</span>
            </a>
            <a href="/hw-cycle" class="nav-item {% if request.path=='/hw-cycle' %}active{% endif %}">
                <i class="bi bi-lightning-charge"></i><span>HW行动</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="status-dot"></div>
            <small>系统运行中</small>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="main-wrap">
        <header class="topbar">
            <div class="d-flex justify-content-between align-items-center w-100">
                <div>
                    <h5 class="mb-0 fw-bold">{% block page_title %}驾驶舱{% endblock %}</h5>
                    <small class="text-muted">{% block page_subtitle %}市场洞察与销售赋能{% endblock %}</small>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="topbar-indicator">
                        <i class="bi bi-dot text-success fs-4"></i> 在线
                    </span>
                </div>
            </div>
        </header>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
