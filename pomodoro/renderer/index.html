<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 标题栏 -->
  <div id="titlebar">
    <span class="titlebar-title">🍅 番茄钟</span>
    <div class="titlebar-controls">
      <button id="btn-pin" title="置顶">📌</button>
      <button id="btn-minimize" title="最小化">―</button>
      <button id="btn-close" title="关闭">✕</button>
    </div>
  </div>

  <!-- 主体 -->
  <div id="container">
    <!-- 模式标签 -->
    <div id="mode-label">专注</div>

    <!-- 模式切换按钮 -->
    <div id="mode-selector">
      <button class="mode-btn active" data-mode="work">🍅 专注</button>
      <button class="mode-btn" data-mode="shortBreak">☕ 短休</button>
      <button class="mode-btn" data-mode="longBreak">🌿 长休</button>
    </div>

    <!-- 环形进度条 -->
    <div id="progress-ring">
      <svg viewBox="0 0 200 200">
        <circle id="ring-bg" cx="100" cy="100" r="88" />
        <circle id="ring-fg" cx="100" cy="100" r="88" />
      </svg>
      <div id="timer-display">25:00</div>
    </div>

    <!-- 番茄计数 -->
    <div id="pomodoro-dots"></div>

    <!-- 控制按钮 -->
    <div id="controls">
      <button id="btn-start" class="btn-primary">开始</button>
      <button id="btn-skip" title="跳过当前时段">跳过</button>
      <button id="btn-reset">重置</button>
    </div>
  </div>

  <script src="timer.js"></script>
</body>
</html>
