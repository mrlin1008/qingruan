# ============================================================
# 益阳高新区智慧招商平台 — Nginx 配置
# 支持 HTTPS (Let's Encrypt) + HTTP/2 + 安全加固
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name invest.yiyang-hitech.example.com;

    # Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name invest.yiyang-hitech.example.com;

    # === SSL 证书（由 certbot 管理） ===
    ssl_certificate     /etc/letsencrypt/live/invest.yiyang-hitech.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invest.yiyang-hitech.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/invest.yiyang-hitech.example.com/chain.pem;

    # === SSL 协议与加密套件（Mozilla 中级配置） ===
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # === OCSP Stapling ===
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # === 安全头 ===
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === 上传限制 ===
    client_max_body_size 10M;

    # === 日志 ===
    access_log /var/log/nginx/yiyang_invest_access.log;
    error_log  /var/log/nginx/yiyang_invest_error.log;

    # === 静态文件（长期缓存） ===
    location /static/ {
        alias /opt/yiyang_invest/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # === 反向代理到 Gunicorn ===
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
    }

    # === Gzip 压缩 ===
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_disable "msie6";
}
