<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 益阳高新区智慧招商平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f1a2e 0%, #1a3350 50%, #0f1a2e 100%);
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            text-align: center;
            margin-bottom: 4px;
        }
        .login-card .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 28px;
        }
        .login-card .form-group {
            margin-bottom: 16px;
        }
        .login-card label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .login-card input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: border-color 0.15s;
            box-sizing: border-box;
        }
        .login-card input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(30,91,255,0.1);
        }
        .login-card .btn-login {
            width: 100%;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
        }
        .login-card .btn-login:hover {
            background: var(--accent-hover);
        }
        .flash-msg {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .flash-error { background: #ffe9e9; color: var(--error); border: 1px solid #fdd; }
        .flash-success { background: #e6f7f1; color: var(--success); border: 1px solid #d4f0e4; }
        .flash-warning { background: #fff4e6; color: var(--warning); border: 1px solid #ffe0b2; }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1><i class="bi bi-building"></i> 益阳高新区</h1>
        <p class="subtitle">智慧招商平台 · 管理后台</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-msg flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="post" action="/auth/login">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>
        <p style="text-align:center; margin-top:16px; font-size:12px; color:var(--text-tertiary);">
            默认账号：admin / admin123
        </p>
    </div>
</div>
</body>
</html>
